name: paper-figure

# Runs ONLY the figure sweep categories (K, M, Q, R, S, T) and exports
# output/figure_panels.csv plus Figure 1 and Figure 2. Self-contained: every
# category it needs is simulated here, so it stays fast (~30-60 min) and is
# safe to iterate on without touching the daily simulations pipeline.
#
# Trigger manually from the Actions tab. "reps" sets the replication
# count for the sweep categories (default 5; use 25-100+ for the
# camera-ready figure).

on:
  workflow_dispatch:
    inputs:
      reps:
        description: "Replications per figure scenario (N_REPS_FIG)"
        type: number
        default: 5

concurrency:
  group: paper-figure
  cancel-in-progress: false

env:
  PKGCACHE_HTTP_RETRIES: "5"
  PKGCACHE_HTTP_DELAY: "3"

jobs:

  # ---------------------------------------------------------------------------
  # simulate: one job per figure category. At low reps each category is
  # minutes of fitting, so per-category jobs amortise the ~5-10 min of
  # R/CmdStan/metadid setup far better than per-scenario jobs would.
  # ---------------------------------------------------------------------------
  simulate:
    name: "Category ${{ matrix.category }}"
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        category: [K, M, Q, R, S, T]
    env:
      N_REPS_FIG: ${{ inputs.reps }}
    steps:
      - name: Checkout metadid-sims
        uses: actions/checkout@v4
        with:
          path: metadid-sims

      - name: Checkout metadid (current main)
        uses: actions/checkout@v4
        with:
          repository: ben18785/metadid
          ref: main
          path: metadid

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
          extra-repositories: "https://mc-stan.org/r-packages/"

      - uses: r-lib/actions/setup-pandoc@v2

      # tarchetypes::tar_quarto() in _targets.R probes the Quarto CLI at
      # pipeline-construction time, so tar_make() needs the binary even
      # though this workflow never renders the report.
      - uses: quarto-dev/quarto-actions/setup@v2

      - name: Install R package dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: metadid-sims
          cache-version: 3

      - name: Cache CmdStan
        id: cmdstan-cache
        uses: actions/cache@v4
        with:
          path: ~/.cmdstan
          key: cmdstan-${{ runner.os }}-v1

      - name: Install CmdStan
        if: steps.cmdstan-cache.outputs.cache-hit != 'true'
        env:
          GITHUB_PAT: ${{ github.token }}
        run: Rscript -e 'cmdstanr::install_cmdstan(cores = 2)'

      - name: Install metadid from local checkout
        run: R CMD INSTALL ./metadid

      - name: Run targets for category ${{ matrix.category }}
        working-directory: metadid-sims
        run: |
          Rscript -e '
            library(targets)
            tar_make(
              names = tidyselect::starts_with("${{ matrix.category }}_")
            )
          '

      - name: Upload _targets store slice
        uses: actions/upload-artifact@v4
        with:
          name: figure-store-${{ matrix.category }}
          path: |
            metadid-sims/_targets/meta/
            metadid-sims/_targets/objects/
          if-no-files-found: error
          retention-days: 14

  # ---------------------------------------------------------------------------
  # assemble: merge category stores, build figure_panels.csv, compute the
  # paired full/naive RMSE contrast, render Figure 1 and Figure 2, and upload
  # everything as artifacts.
  # ---------------------------------------------------------------------------
  assemble:
    name: Assemble figure
    needs: simulate
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      N_REPS_FIG: ${{ inputs.reps }}
    steps:
      - name: Checkout metadid-sims
        uses: actions/checkout@v4
        with:
          path: metadid-sims

      - name: Checkout metadid (current main)
        uses: actions/checkout@v4
        with:
          repository: ben18785/metadid
          ref: main
          path: metadid

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
          extra-repositories: "https://mc-stan.org/r-packages/"

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: quarto-dev/quarto-actions/setup@v2

      - name: Install R package dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: metadid-sims
          cache-version: 3

      - name: Cache CmdStan
        id: cmdstan-cache
        uses: actions/cache@v4
        with:
          path: ~/.cmdstan
          key: cmdstan-${{ runner.os }}-v1

      - name: Install CmdStan
        if: steps.cmdstan-cache.outputs.cache-hit != 'true'
        env:
          GITHUB_PAT: ${{ github.token }}
        run: Rscript -e 'cmdstanr::install_cmdstan(cores = 2)'

      - name: Install metadid from local checkout
        run: R CMD INSTALL ./metadid

      - name: Download category store slices
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: figure-store-*

      - name: Merge _targets stores
        working-directory: metadid-sims
        run: |
          set -euo pipefail
          mkdir -p _targets/meta _targets/objects
          for d in ../artifacts/figure-store-*; do
            if [ -d "$d/objects" ]; then
              cp -rn "$d"/objects/. _targets/objects/ || true
            fi
          done
          first=$(ls -1 ../artifacts/figure-store-*/meta/meta 2>/dev/null | head -1)
          if [ -z "$first" ]; then
            echo "::error::No meta files found in downloaded artifacts"
            exit 1
          fi
          head -n 1 "$first" > _targets/meta/meta
          for f in ../artifacts/figure-store-*/meta/meta; do
            tail -n +2 "$f"
          done | awk -F'|' '!seen[$1]++' >> _targets/meta/meta
          echo "Merged $(wc -l < _targets/meta/meta) meta rows, $(ls _targets/objects | wc -l) objects."

      - name: Build figure data and render figure
        working-directory: metadid-sims
        run: |
          Rscript -e '
            library(targets)
            library(dplyr)

            # Build the sweep aggregates (cached from the category jobs).
            tar_make(names = c("K_agg", "M_agg",
                               "Q_agg", "R_agg", "S_agg", "T_agg",
                               "paired_rmse_MT", "illustration_draws"))

            tar_source("R/scenarios.R")
            tar_source("R/plots.R")

            # Tagged by category, not panel position -- see _targets.R.
            sweeps <- bind_rows(
              mutate(tar_read(M_agg), category = "M"),
              mutate(tar_read(K_agg), category = "K"),
              mutate(tar_read(R_agg), category = "R"),
              mutate(tar_read(Q_agg), category = "Q"),
              mutate(tar_read(S_agg), category = "S"),
              mutate(tar_read(T_agg), category = "T")
            )

            all_agg <- sweeps

            dir.create("output", showWarnings = FALSE)
            all_agg |>
              filter(parameter == "treatment_effect_mean") |>
              readr::write_csv("output/figure_panels.csv")

            # Publication layouts: Figure 1, Figure 2, and the SI panels.
            illus <- tar_read(illustration_draws)
            readr::write_csv(illus, "output/illustration_draws.csv")
            paired <- tar_read(paired_rmse_MT)
            readr::write_csv(paired, "output/paired_rmse_MT.csv")
            f1 <- plot_figure1(all_agg, illus, paired)
            ggplot2::ggsave("output/figure1.png", f1, width = 13, height = 9,
                            dpi = 300, limitsize = FALSE)
            ggplot2::ggsave("output/figure1.pdf", f1, width = 13, height = 9,
                            limitsize = FALSE)
            # Single row of three panels with collected legends beneath.
            f2 <- plot_figure2(all_agg)
            ggplot2::ggsave("output/figure2.png", f2, width = 13, height = 5,
                            dpi = 300, limitsize = FALSE)
            ggplot2::ggsave("output/figure2.pdf", f2, width = 13, height = 5,
                            limitsize = FALSE)
          '

      - name: Upload figure artifacts
        uses: actions/upload-artifact@v4
        with:
          name: paper-figure
          path: |
            metadid-sims/output/figure_panels.csv
            metadid-sims/output/illustration_draws.csv
            metadid-sims/output/paired_rmse_MT.csv
            metadid-sims/output/figure1.png
            metadid-sims/output/figure1.pdf
            metadid-sims/output/figure2.png
            metadid-sims/output/figure2.pdf
          if-no-files-found: error
          retention-days: 90
