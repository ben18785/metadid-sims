name: paper-figure

# Runs ONLY the figure sweep categories (K, M, Q, R, S, T) and exports
# output/figure_panels.csv plus Figure 1 and Figure 2. Self-contained: every
# category it needs is simulated here, so it stays fast (~30-60 min) and is
# safe to iterate on without touching the daily simulations pipeline.
#
# Trigger manually from the Actions tab. "reps" sets the replication
# count for the sweep categories (default 5; use 25-100+ for the
# camera-ready figure).

on:
  workflow_dispatch:
    inputs:
      reps:
        description: "Replications per figure scenario (N_REPS_FIG)"
        type: number
        default: 5

concurrency:
  group: paper-figure
  cancel-in-progress: false

env:
  PKGCACHE_HTTP_RETRIES: "5"
  PKGCACHE_HTTP_DELAY: "3"

jobs:

  # ---------------------------------------------------------------------------
  # simulate: one job per figure category. At low reps each category is
  # minutes of fitting, so per-category jobs amortise the ~5-10 min of
  # R/CmdStan/metadid setup far better than per-scenario jobs would.
  # ---------------------------------------------------------------------------
  simulate:
    name: "Category ${{ matrix.name }}"
    runs-on: ubuntu-latest
    # 360 is GitHub's hard ceiling for a job on a hosted runner -- a larger
    # value here has no effect, the job is killed at 6h either way. To go past
    # it the work has to be split across more jobs (Q's 25 scenarios are the
    # obvious candidate), or moved to a self-hosted runner.
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        # Each entry names a regex over TARGET names, not a category letter,
        # so an expensive category can be split across jobs. Q is 25 scenarios
        # and was the critical path at ~36 min of fitting per global rep; the
        # two chunks partition Q1-Q12 / Q13-Q25 exactly. Q_rep and Q_agg are
        # deliberately NOT matched here -- they bind across all 25 scenarios
        # and so can only be built in assemble, after the slices are merged.
        include:
          - name: K
            regex: '^K_'
          - name: M
            regex: '^M_'
          - name: Qa
            regex: '^Q_rep_Q([1-9]|1[0-2])(_combine)?$'
          - name: Qb
            regex: '^Q_rep_Q(1[3-9]|2[0-5])(_combine)?$'
          - name: R
            regex: '^R_'
          - name: S
            regex: '^S_' 
    env:
      N_REPS_FIG: ${{ inputs.reps }}
    steps:
      - name: Checkout metadid-sims
        uses: actions/checkout@v4
        with:
          path: metadid-sims

      - name: Checkout metadid (current main)
        uses: actions/checkout@v4
        with:
          repository: ben18785/metadid
          ref: main
          path: metadid

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
          extra-repositories: "https://mc-stan.org/r-packages/"

      - uses: r-lib/actions/setup-pandoc@v2

      # tarchetypes::tar_quarto() in _targets.R probes the Quarto CLI at
      # pipeline-construction time, so tar_make() needs the binary even
      # though this workflow never renders the report.
      - uses: quarto-dev/quarto-actions/setup@v2

      - name: Install R package dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: metadid-sims
          cache-version: 3

      - name: Cache CmdStan
        id: cmdstan-cache
        uses: actions/cache@v4
        with:
          path: ~/.cmdstan
          key: cmdstan-${{ runner.os }}-v1

      - name: Install CmdStan
        if: steps.cmdstan-cache.outputs.cache-hit != 'true'
        env:
          GITHUB_PAT: ${{ github.token }}
        run: Rscript -e 'cmdstanr::install_cmdstan(cores = 2)'

      - name: Install metadid from local checkout
        run: R CMD INSTALL ./metadid

      - name: Run targets for ${{ matrix.name }}
        working-directory: metadid-sims
        run: |
          Rscript -e '
            library(targets)
            sel <- grep("${{ matrix.regex }}",
                        tar_manifest(callr_function = NULL)$name, value = TRUE)
            cat("matched", length(sel), "targets\n")
            # A regex that silently matches nothing would upload a slice with
            # the category missing, and assemble would then re-simulate it
            # serially. Fail loudly instead.
            if (!length(sel)) stop("regex matched no targets")
            tar_make(names = tidyselect::all_of(sel))
          '

      - name: Upload _targets store slice
        uses: actions/upload-artifact@v4
        with:
          name: figure-store-${{ matrix.name }}
          path: |
            metadid-sims/_targets/meta/
            metadid-sims/_targets/objects/
          if-no-files-found: error
          retention-days: 14

  # ---------------------------------------------------------------------------
  # assemble: merge category stores, build figure_panels.csv, compute the
  # paired full/naive RMSE contrast, render Figure 1 and Figure 2, and upload
  # everything as artifacts.
  # ---------------------------------------------------------------------------
  assemble:
    name: Assemble figure
    needs: simulate
    # NOT always(): that also fires when the run is CANCELLED, and this job
    # would then start a tar_make against an empty store and re-simulate every
    # missing category serially on one runner -- the failure that burned 6h in
    # sims.yaml run 31431550646. !cancelled() keeps the recover-from-partial-
    # failure behaviour without the cancellation pathology.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      N_REPS_FIG: ${{ inputs.reps }}
    steps:
      - name: Checkout metadid-sims
        uses: actions/checkout@v4
        with:
          path: metadid-sims

      - name: Checkout metadid (current main)
        uses: actions/checkout@v4
        with:
          repository: ben18785/metadid
          ref: main
          path: metadid

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
          extra-repositories: "https://mc-stan.org/r-packages/"

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: quarto-dev/quarto-actions/setup@v2

      - name: Install R package dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: metadid-sims
          cache-version: 3

      - name: Cache CmdStan
        id: cmdstan-cache
        uses: actions/cache@v4
        with:
          path: ~/.cmdstan
          key: cmdstan-${{ runner.os }}-v1

      - name: Install CmdStan
        if: steps.cmdstan-cache.outputs.cache-hit != 'true'
        env:
          GITHUB_PAT: ${{ github.token }}
        run: Rscript -e 'cmdstanr::install_cmdstan(cores = 2)'

      - name: Install metadid from local checkout
        run: R CMD INSTALL ./metadid

      - name: Download category store slices
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: figure-store-*

      - name: Merge _targets stores
        working-directory: metadid-sims
        run: |
          set -euo pipefail
          mkdir -p _targets/meta _targets/objects
          for d in ../artifacts/figure-store-*; do
            if [ -d "$d/objects" ]; then
              cp -rn "$d"/objects/. _targets/objects/ || true
            fi
          done
          first=$(ls -1 ../artifacts/figure-store-*/meta/meta 2>/dev/null | head -1)
          if [ -z "$first" ]; then
            echo "::error::No meta files found in downloaded artifacts"
            exit 1
          fi
          head -n 1 "$first" > _targets/meta/meta
          for f in ../artifacts/figure-store-*/meta/meta; do
            tail -n +2 "$f"
          done | awk -F'|' '!seen[$1]++' >> _targets/meta/meta
          echo "Merged $(wc -l < _targets/meta/meta) meta rows, $(ls _targets/objects | wc -l) objects."

      - name: Build figure data and render figure
        working-directory: metadid-sims
        run: |
          Rscript -e '
            library(targets)
            library(dplyr)

            # Build the sweep aggregates (cached from the category jobs).
            tar_make(names = c("K_agg", "M_agg",
                               "Q_agg", "R_agg", "S_agg",
                               "paired_contrasts", "illustration_draws"))

            tar_source("R/scenarios.R")
            tar_source("R/plots.R")

            # Tagged by category, not panel position -- see _targets.R.
            sweeps <- bind_rows(
              mutate(tar_read(M_agg), category = "M"),
              mutate(tar_read(K_agg), category = "K"),
              mutate(tar_read(R_agg), category = "R"),
              mutate(tar_read(Q_agg), category = "Q"),
              mutate(tar_read(S_agg), category = "S")
            )

            all_agg <- sweeps

            dir.create("output", showWarnings = FALSE)
            all_agg |>
              filter(parameter == "treatment_effect_mean") |>
              readr::write_csv("output/figure_panels.csv")

            # Publication layouts: Figure 1, Figure 2, and the SI panels.
            illus <- tar_read(illustration_draws)
            readr::write_csv(illus, "output/illustration_draws.csv")
            paired <- tar_read(paired_contrasts)
            readr::write_csv(paired, "output/paired_contrasts.csv")

            # Rendering is deliberately a single call into R/plots.R so that a
            # local render from the same CSVs cannot drift from CI's.
            render_paper_figures("output")
          '

      - name: Upload figure artifacts
        uses: actions/upload-artifact@v4
        with:
          name: paper-figure
          path: |
            metadid-sims/output/figure_panels.csv
            metadid-sims/output/illustration_draws.csv
            metadid-sims/output/paired_contrasts.csv
            metadid-sims/output/figure1.png
            metadid-sims/output/figure1.pdf
            metadid-sims/output/figure2.png
            metadid-sims/output/figure2.pdf
          if-no-files-found: error
          retention-days: 90
